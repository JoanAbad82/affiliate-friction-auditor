version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "07:20"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      routine-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
