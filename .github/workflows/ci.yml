name: repository-safety

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: afa-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Repository safety / Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate repository safety and syntax
        run: python scripts/verify_repo_safe.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  merge_gate:
    name: afa-merge-gate
    needs: [safety]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce all safety matrix jobs
        env:
          MATRIX_RESULT: ${{ needs.safety.result }}
        run: test "$MATRIX_RESULT" = "success"
